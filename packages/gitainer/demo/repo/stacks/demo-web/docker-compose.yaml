#! fragments/common.yaml
services:
  app:
    <<: *common
    image: alpine:latest
    command: sleep infinity
    stop_grace_period: 1s
    labels:
      caddy: app.${DOMAIN}
      app.sentry-dsn: ${SENTRY_DSN}
  worker:
    <<: *common
    image: alpine:latest
    command: sleep infinity
    stop_grace_period: 1s
    environment:
      CACHE_URL: redis://:${CACHE_PASSWORD}@cache:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
